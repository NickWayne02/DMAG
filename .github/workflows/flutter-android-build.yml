name: Flutter Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Get dependencies
        run: flutter pub get
        working-directory: mobile_app_flutter

      - name: Build DMAG APK
        run: flutter build apk --release
        working-directory: mobile_app_flutter

      - name: Upload DMAG APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: mobile_app_flutter/build/app/outputs/flutter-apk/app-release.apk

      - name: Build E&R Clone APK
        run: |
          flutter build apk --release --dart-define=APP_BRAND=er
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/er-release.apk
        working-directory: mobile_app_flutter

      - name: Upload E&R Clone APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: er-app-release
          path: mobile_app_flutter/build/app/outputs/flutter-apk/er-release.apk
